name: salaty
description: "Salaty — prayer tracking app (Clean Architecture + Cubit)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- UI ---
  flutter_svg: ^2.0.17
  flutter_screenutil: ^5.9.3

  # --- State management (Cubit/Bloc) ---
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # --- Dependency injection ---
  get_it: ^8.0.3

  # --- Functional error handling ---
  dartz: ^0.10.1

  # --- Local storage ---
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.2

  # --- Domain / device ---
  hijri: ^3.0.0
  adhan_dart: ^1.1.2
  geolocator: ^13.0.3
  flutter_compass_v2: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/icons/prayerIcons/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont.ttf
